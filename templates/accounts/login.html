<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KHBL — Đăng nhập</title>
<style>
  :root { --gold-700:#8C6A1D; --gold-500:#C9A02C; --gold-100:#F7EFD8; --ink:#1C1917; --line:#EAE4D6; --surface:#FDFCF9; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--surface); color:var(--ink); font:14px/1.5 "Be Vietnam Pro","Segoe UI",sans-serif; }
  .card { width:min(380px, 92vw); background:#fff; border:1px solid var(--line); border-top:4px solid var(--gold-500); border-radius:10px; padding:28px 26px; box-shadow:0 8px 30px rgba(28,25,23,.06); }
  h1 { font-family:"Cormorant Garamond",Georgia,serif; color:var(--gold-700); margin:0 0 2px; font-size:30px; }
  .sub { color:#78716c; margin-bottom:18px; font-size:13px; }
  label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--gold-700); margin:10px 0 4px; }
  input { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; font-size:14px; }
  input:focus { outline:2px solid var(--gold-300, #E4C56A); border-color:var(--gold-500); }
  button { width:100%; margin-top:18px; padding:10px; border:0; border-radius:6px; background:var(--gold-500); color:#fff; font-weight:600; font-size:14px; cursor:pointer; }
  .err { background:#FDF2F0; color:#B3402A; border:1px solid #E4B5AC; border-radius:6px; padding:8px 10px; font-size:13px; margin-bottom:8px; }
  .note { margin-top:14px; font-size:12px; color:#a8a29e; }
</style>
</head>
<body>
<form class="card" method="post">
  {% csrf_token %}
  <h1>KHBL</h1>
  <div class="sub">Bán lẻ Kim Hạnh 2 — đăng nhập bằng tài khoản app (admin / kimhanh2)</div>
  {% if form.errors %}<div class="err">Sai tên đăng nhập hoặc mật khẩu.</div>{% endif %}
  <label for="id_username">Tên đăng nhập</label>
  <input id="id_username" name="username" autofocus autocomplete="username" required value="{{ form.username.value|default:'' }}">
  <label for="id_password">Mật khẩu</label>
  <input id="id_password" name="password" type="password" autocomplete="current-password" required>
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Đăng nhập</button>
  <div class="note">Tài khoản web: admin · kimhanh2 (mật khẩu riêng của web, lưu dạng băm).</div>
</form>
</body>
</html>
