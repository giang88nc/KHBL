{% if r.co_the_thao_tac and r.IsDel == "0" %}{% if r.Status == "C" %}<button class="khbl-btn khbl-btn--sm hd-actions__pay" hx-get="{% url 'pos:hoa_don_xac_nhan' %}?trn_id={{ r.TrnID }}&loai={{ r.loai }}&group={% if r.group_size > 1 %}1{% else %}0{% endif %}&action=thanh_toan" hx-target="#modal-root">Hủy thanh toán</button>{% if co_fullcontrol %}<button class="khbl-btn khbl-btn--sm hd-actions__cancel" hx-get="{% url 'pos:hoa_don_xac_nhan' %}?trn_id={{ r.TrnID }}&loai={{ r.loai }}&group={% if r.group_size > 1 %}1{% else %}0{% endif %}&action=hoa_don" hx-target="#modal-root">Hủy hóa đơn</button>{% else %}<button class="khbl-btn khbl-btn--sm khbl-btn--cho" disabled title="Hủy thanh toán trước">Hủy hóa đơn</button>{% endif %}{% else %}<button class="khbl-btn khbl-btn--sm khbl-btn--cho" disabled>Đã hủy thanh toán</button><button class="khbl-btn khbl-btn--sm hd-actions__cancel" hx-get="{% url 'pos:hoa_don_xac_nhan' %}?trn_id={{ r.TrnID }}&loai={{ r.loai }}&group={% if r.group_size > 1 %}1{% else %}0{% endif %}&action=hoa_don" hx-target="#modal-root">Hủy hóa đơn</button>{% endif %}{% elif r.IsDel == "0" %}<span class="hd-actions__readonly" title="Đơn ngoài ngày hôm nay">Chỉ xem</span>{% endif %}
