{% extends 'partials/modal_shell.html' %}
{% block modal_title %}Xác nhận khách đã lấy hàng{% endblock %}
{% block modal_body %}{% if error %}<p role="alert">{{ error }}</p>{% endif %}<b>{{ row.BillCode }}</b>{% if allowed %}<form id="online-pickup-form" hx-post="{% url 'pos:mobile_online_pickup' row.TrnID %}" hx-target="#modal-root" hx-disabled-elt="find button"><input type="hidden" name="version" value="{{ version }}">{% csrf_token %}<label style="display:flex;gap:4px;padding:4px;min-height:44px;align-items:center"><input type="checkbox" name="confirm" value="1" required>Tôi xác nhận khách đã nhận đủ hàng của phiếu này.</label><p>Hệ thống lưu thời gian và nhân viên đang đăng nhập.</p><button type="submit" class="khbl-btn khbl-btn--gold">Xác nhận đã giao</button></form>{% endif %}{% endblock %}
