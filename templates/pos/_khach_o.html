{% load pos_extras %}<div class="khbl-bar__cust" style="position:relative">
  {% if gio.cust %}
    <div style="min-width:0">
      <div style="font-size:15px;font-weight:600">{{ gio.cust.name }}</div>
      <div class="dim" style="font-size:12px"><span class="mono">{{ gio.cust.phone }}</span>
        {% if gio.cust.code %}· <span class="mono">{{ gio.cust.code }}</span>{% endif %}
        {% if gio.cust.diem %}· {{ gio.cust.diem }} điểm{% endif %}</div>
    </div>
    <button class="khbl-btn khbl-btn--ghost khbl-btn--sm" type="button" title="Bỏ chọn khách"
            hx-post="{% url 'pos:ban_dat' %}" hx-vals='{"cust_id": ""}' hx-swap="none">×</button>
  {% else %}
    <div class="khbl-bar__cust--empty" style="display:flex;align-items:center;gap:8px">
      <input id="o-khach" class="khbl-input" name="q" placeholder="F2 — tìm khách theo số điện thoại / tên"
             style="width:290px;border:0;padding:4px 0;background:transparent"
             hx-get="{% url 'pos:ban_tim_khach' %}" hx-trigger="keyup changed delay:220ms"
             hx-target="#khach-goiy" autocomplete="off">
    </div>
    <div id="khach-goiy" style="position:absolute;top:40px;left:0;z-index:30"></div>
  {% endif %}
</div>
