<div class="dc-line dc-row-sp">
{{ item.Mode }}{{ item.TotalWeight }}{{ item.DisplayUnits }}{{ item.DiamondWeight }}{{ item.SL }}{{ item.Notes }}<span hidden>{{ item.DELETE }}</span>
<div class="dc-row-grid">
<label class="dc-row-code">Mã SP{{ item.ProductCode }}{{ item.ProductCode.errors }}</label>
<label class="dc-row-name">Tên SP <b class="dc-required">*</b> <small data-dc-quantity></small>{{ item.ProductDesc }}{{ item.ProductDesc.errors }}</label>
<label>Loại <b class="dc-required">*</b>{{ item.GoldCode }}{{ item.GoldCode.errors }}</label>
<label>TL vàng <b class="dc-required">*</b> <span data-dc-unit>chỉ</span>{{ item.GoldWeight }}{{ item.GoldWeight.errors }}</label>
<label>Size{{ item.Size }}{{ item.Size.errors }}</label>
<label class="dc-row-task">Công (₫){{ item.TaskPrice }}{{ item.TaskPrice.errors }}</label>
<div class="dc-row-subtotal"><span>Tạm tính (₫)</span><output data-dc-row-total>—</output></div>
<button type="button" class="dc-row-remove" data-dc-remove-line aria-label="Bỏ món khỏi phiếu" title="Bỏ món">×</button>
</div><div class="dc-stock-results" aria-live="polite"></div>{{ item.non_field_errors }}{{ item.TotalWeight.errors }}{{ item.Mode.errors }}
</div>
