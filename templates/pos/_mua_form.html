{% load pos_extras %}<form class="khbl-scan" style="gap:8px;padding:8px 0;flex-wrap:wrap"
      hx-post="{% url 'pos:ban_mua_them' %}" hx-swap="none">
  <div class="khbl-field" style="width:150px">
    <label>Loại vàng cũ</label>
    <select class="khbl-select" name="gold">
      {% for g in loai_thau %}<option value="{{ g.GoldCcy }}">{{ g.GoldDesc }} — {{ g.mua_dong|tien_tran }}</option>{% endfor %}
    </select>
  </div>
  <div class="khbl-field" style="width:118px">
    <label>Trọng lượng (ly)</label>
    <input class="khbl-input num" name="gw" inputmode="decimal" placeholder="vd 105" autocomplete="off">
  </div>
  <div class="khbl-field" style="width:78px">
    <label>Tuổi (%)</label>
    <input class="khbl-input num" name="pct" value="100" inputmode="decimal">
  </div>
  <div class="khbl-field"><label>&nbsp;</label>
    <button class="khbl-btn khbl-btn--outline" type="submit" style="border-color:var(--ink-mua);color:var(--ink-mua)">Nhận vàng cũ</button>
  </div>
  {% if mua_err %}<div class="khbl-alert khbl-alert--cam" style="width:100%">{{ mua_err }}</div>{% endif %}
  <div class="dim" style="font-size:11.5px;width:100%">1 chỉ = 100 ly · 1 lượng = 1.000 ly. Tiền tính theo giá THÂU của bảng giá, nhân tuổi vàng.</div>
</form>
